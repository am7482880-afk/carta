<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regalo para mi cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@500;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: íntimo, romántico, casi un susurro.
IDEA: una tarjeta de cumpleaños que se escribe sola bajo una lluvia de corazones.
PICTURE: una polaroid nuestra con borde dorado y un corazón que late y se puede tocar.
COLOUR and TYPE: morado de noche a lila, dorado y blanco; Great Vibes, Caveat y Quicksand.
LAYOUT: una sola pantalla centrada: foto, frase que se escribe, corazón, firma, volver.
*/
:root{color-scheme:light;--deep:#2e1450;--plum:#5b2d8e;--violet:#8a5cc7;--lilac:#c9a8f0;--lav:#ecdfff;--gold:#d9b25f;--gold2:#f4dc9a;--white:#fffdf8}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100svh;overflow-x:clip;font:16px/1.6 'Quicksand',system-ui,sans-serif;color:var(--white);
  background:radial-gradient(900px 600px at 50% 30%,rgba(201,168,240,.55),transparent 65%),
             linear-gradient(180deg,#3b1d63 0%,#6a3aa6 45%,#a77ae0 80%,#d6bff5 100%);background-attachment:fixed}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.h{position:absolute;bottom:-40px;animation:rise linear infinite;opacity:.8}
@keyframes rise{to{transform:translate(var(--dx),-115vh) rotate(var(--rot));opacity:0}}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold2);box-shadow:0 0 10px 3px rgba(244,220,154,.8);animation:tw 2.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
main{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 18px 48px;text-align:center}
.kicker{font-family:'Caveat',cursive;font-size:clamp(24px,6vw,32px);color:var(--gold2);margin:0;animation:in 1s both}
.kicker::before,.kicker::after{content:"✦";font-size:.6em;margin:0 10px;vertical-align:middle}
.polaroid{position:relative;margin:0;background:var(--white);padding:10px 10px 40px;width:min(250px,64vw);border:2px solid var(--gold);border-radius:3px;
  box-shadow:0 0 0 5px rgba(255,253,248,.25),0 0 50px rgba(244,220,154,.35),0 20px 40px rgba(20,5,40,.5);transform:rotate(-3deg);animation:in 1.1s .2s both}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.polaroid figcaption{position:absolute;left:0;right:0;bottom:6px;font-family:'Caveat',cursive;font-size:22px;color:var(--plum)}
.polaroid::before{content:"";position:absolute;top:-12px;left:50%;width:70px;height:22px;margin-left:-35px;transform:rotate(3deg);
  background:repeating-linear-gradient(90deg,rgba(201,168,240,.9) 0 8px,rgba(236,223,255,.9) 8px 16px)}
@keyframes in{from{opacity:0;transform:translateY(24px) rotate(0)}}
.phrase{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(40px,10vw,76px);line-height:1.12;margin:0;max-width:820px;min-height:2.3em;
  text-shadow:0 0 26px rgba(244,220,154,.55),0 2px 0 rgba(46,20,80,.4);text-wrap:balance}
.caret{display:inline-block;width:2px;height:.8em;background:var(--gold2);margin-left:4px;vertical-align:-.05em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.heart{appearance:none;border:0;background:none;cursor:pointer;font-size:62px;line-height:1;padding:8px;min-width:88px;min-height:88px;
  filter:drop-shadow(0 0 16px rgba(201,168,240,.9));animation:beat 1.3s ease-in-out infinite;opacity:0;transition:opacity 1s}
.heart.show{opacity:1}
.heart:focus-visible{outline:3px solid var(--gold2);outline-offset:4px;border-radius:50%}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.tap{font-family:'Caveat',cursive;font-size:21px;color:var(--lav);margin:-14px 0 0;opacity:0;transition:opacity 1s .4s}
.tap.show{opacity:.9}
.sign{font-family:'Great Vibes',cursive;font-size:44px;line-height:1;color:var(--gold2);margin:0;opacity:0;transition:opacity 1.2s .8s}
.sign.show{opacity:1}
.back{color:var(--white);text-decoration:none;font-weight:700;font-size:16px;padding:14px 24px;min-height:48px;border-radius:999px;display:inline-flex;align-items:center;
  border:2px solid var(--gold2);background:rgba(255,253,248,.12);backdrop-filter:blur(4px);transition:background .2s}
.back:hover{background:rgba(255,253,248,.25)}
.back:focus-visible{outline:3px solid var(--gold2);outline-offset:4px}
.pop{position:fixed;z-index:5;pointer-events:none;font-size:22px;animation:pop 1.4s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}.h,.spark{display:none}}
</style>
</head>

  <h1 class="phrase" aria-label="Tú ya sabes qué es lo que quiero para toda la vida..."><span id="type"></span><span class="caret" aria-hidden="true"></span></h1>
  <button class="heart" id="heart" type="button" aria-label="Lanzar corazones">💜</button>
  <p class="tap" id="tap">tócame 🤍</p>
  <p class="sign" id="sign">Tu Cachetes</p>
  <a class="back" href="index.html">← Volver a mi carta</a>
</main>
<script>
{
  const text='Tú ya sabes qué es lo que quiero para toda la vida...';
  const el=document.getElementById('type');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const reveal=()=>['heart','tap','sign'].forEach(id=>document.getElementById(id).classList.add('show'));
  if(reduce){el.textContent=text;reveal();}
  else{
    let i=0;
    setTimeout(function step(){
      el.textContent=text.slice(0,++i);
      if(i<text.length) setTimeout(step, text[i-1]===' '?110:75);
      else reveal();
    },1300);
  }

  const sky=document.getElementById('sky'), small=innerWidth<600, hs=['💜','🤍','💜','✨','💗'];
  for(let i=0;i<(small?20:34);i++){
    const h=document.createElement('span'); h.className='h'; h.textContent=hs[i%hs.length];
    h.style.left=Math.random()*100+'vw'; h.style.fontSize=(12+Math.random()*20)+'px';
    h.style.setProperty('--dx',(Math.random()*120-60)+'px'); h.style.setProperty('--rot',(Math.random()*90-45)+'deg');
    h.style.animationDuration=(9+Math.random()*10)+'s'; h.style.animationDelay=(-Math.random()*18)+'s';
    sky.appendChild(h);
  }
  for(let i=0;i<(small?12:22);i++){
    const s=document.createElement('span'); s.className='spark';
    s.style.left=Math.random()*100+'vw'; s.style.top=Math.random()*100+'vh'; s.style.animationDelay=(Math.random()*3)+'s';
    sky.appendChild(s);
  }

  document.getElementById('heart').addEventListener('click',e=>{
    const r=e.currentTarget.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
    for(let i=0;i<18;i++){
      const p=document.createElement('span'); p.className='pop'; p.textContent=hs[i%hs.length];
      p.style.left=(x-11)+'px'; p.style.top=(y-11)+'px';
      const a=Math.random()*Math.PI*2, d=70+Math.random()*130;
      p.style.setProperty('--x',Math.cos(a)*d+'px'); p.style.setProperty('--y',(Math.sin(a)*d-60)+'px');
      document.body.appendChild(p); setTimeout(()=>p.remove(),1500);
    }
  });
}
</script>
